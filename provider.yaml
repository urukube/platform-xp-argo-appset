---
# The Provider/DeploymentRuntimeConfig/ProviderConfig for provider-kubernetes
# are declared once in platform-xp-crossplane-shared/provider-kubernetes.yaml
# (shared with platform-xp-eks) — declaring them here too would make ArgoCD
# see two Applications independently owning the same objects, producing a
# permanent SharedResourceWarning. Only this repo's own scoped RBAC lives
# here, bound to that shared provider's ServiceAccount
# (provider-kubernetes-incluster, in crossplane-system).
#
# Scoped to the argocd namespace only — this provider must never be able to
# touch resources outside of it. get/list/watch are required for the
# provider's observe loop; create/update/patch/delete are what the task
# requires for managing ApplicationSets and the per-claim GitHub token Secret
# the composition creates from spec.parameters.githubOrgPat.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provider-kubernetes-applicationsets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provider-kubernetes-applicationsets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes-incluster
    namespace: crossplane-system
roleRef:
  kind: Role
  name: provider-kubernetes-applicationsets
  apiGroup: rbac.authorization.k8s.io
