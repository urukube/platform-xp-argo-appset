---
# Installs the Upbound provider-kubernetes package and wires it to a
# dedicated in-cluster identity (provider-kubernetes-incluster). Unlike the
# AWS providers used by other platform-xp-* repos (which assume a cross-account
# IRSA role), this provider talks to the orchestrator cluster's own API server —
# it applies the ApplicationSets generated by composition.yaml directly to the
# argocd namespace.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: upbound-provider-kubernetes
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  package: xpkg.upbound.io/upbound/provider-kubernetes:v1.2.6
  runtimeConfigRef:
    name: provider-kubernetes-incluster

---
# Grants the provider pod a service account named provider-kubernetes-incluster
# in crossplane-system (the namespace providers run in).
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-kubernetes-incluster
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-kubernetes-incluster

---
# Scoped to the argocd namespace only — this provider must never be able to
# touch resources outside of it. get/list/watch are required for the
# provider's observe loop; create/update/patch/delete are what the task
# requires for managing ApplicationSets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provider-kubernetes-applicationsets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provider-kubernetes-applicationsets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes-incluster
    namespace: crossplane-system
roleRef:
  kind: Role
  name: provider-kubernetes-applicationsets
  apiGroup: rbac.authorization.k8s.io

---
# Sync-wave 0 (default, explicit here for clarity) — must land strictly after
# the Provider above (wave -1) so kubernetes.crossplane.io's CRDs are already
# registered by the time ArgoCD applies this.
#
# SkipDryRunOnMissingResource=true is required in addition to the sync-wave:
# ArgoCD dry-run-validates every resource in the sync up front, across all
# waves, before applying anything — so on a cold cluster where this CRD isn't
# registered yet, the dry-run fails and ArgoCD aborts the ENTIRE Application
# sync before wave -1 (the Provider that would register the CRD) is ever
# applied. This option skips that pre-flight check for this resource, so the
# live apply proceeds; it'll still fail on the first attempt (CRD genuinely
# not registered yet) but succeeds on a later automatic retry once the
# Provider — created in wave -1, independently of this resource's fate —
# has finished installing.
#
# Static ProviderConfig — one for the whole cluster, referenced by every
# Object resource this composition generates. InjectedIdentity uses the
# service account above (mounted into the provider pod) to talk to the
# orchestrator cluster's own API server.
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: kubernetes-incluster
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  credentials:
    source: InjectedIdentity
