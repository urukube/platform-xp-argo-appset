---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xuargoappsets.gitops.platform.urukube.io
  labels:
    provider: kubernetes
spec:
  compositeTypeRef:
    apiVersion: gitops.platform.urukube.io/v1alpha1
    kind: XUArgoAppSet
  mode: Pipeline
  pipeline:
    # -------------------------------------------------------------------------
    # Step 1 — Resolve EnvironmentConfigs into the pipeline context.
    # Merges org-defaults (static) with the BU-specific config selected by
    # the bu-id label matching spec.parameters.buId from the claim.
    # -------------------------------------------------------------------------
    - step: resolve-environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: org-defaults
            - type: Selector
              selector:
                matchLabels:
                  - key: bu-id
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.parameters.buId

    # -------------------------------------------------------------------------
    # Step 2 — Generate a single ArgoCD ApplicationSet as a provider-kubernetes
    # Object resource, applied in-cluster via the static kubernetes-incluster
    # ProviderConfig declared in provider.yaml.
    #
    # goTemplate: true, so the ArgoCD ApplicationSet controller evaluates
    # {{ .repository }} / {{ .branch }} / {{ .url }} itself at generate-time.
    # Those expressions must reach the cluster byte-for-byte — the
    # {{`{{`}} ... {{`}}`}} construct below is a standard Go-template escape
    # that emits literal "{{" / "}}" so function-go-templating does not try to
    # resolve them against its own (unrelated) template context.
    #
    # One scmProvider generator covers every branch class (the main branch
    # plus any number of preview prefixes) via one filter per branchMatch
    # pattern. The installed ApplicationSet CRD does not allow a `template`
    # override nested under a plain generator entry (only under matrix/merge),
    # so per-branch-class overrides (preview namespace, values file) are
    # expressed once in the shared top-level `template`, selected at ArgoCD
    # render time via regexMatch against a single alternation regex built
    # from previewBranchPrefixes. Adding more preview prefixes later — or
    # more branch types in general — only touches the claim's parameters,
    # not this template.
    # -------------------------------------------------------------------------
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $params    := .observed.composite.resource.spec.parameters }}
            {{- $obs       := default (dict) .observed.resources }}
            {{- $claimName := index .observed.composite.resource.metadata.labels "crossplane.io/claim-name" }}

            {{- $readyMap := dict }}
            {{- range $crn, $res := $obs }}
            {{- range $res.resource.status.conditions }}
            {{- if and (eq .type "Ready") (eq .status "True") }}
            {{- $readyMap = merge $readyMap (dict $crn "True") }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- $clusterName    := printf "%s-eks" $params.eksFriendlyName }}
            {{- $chartPath      := $params.helmChartPath }}
            {{- $valuesRel      := printf "%s/values.yaml" $params.environment }}
            {{- $tokenSecret    := printf "%s-github-token" $claimName }}
            {{- $requeue        := $params.requeueSeconds }}
            {{- $topicRegex     := printf "^%s$" ($params.repoLabel | regexQuoteMeta) }}
            {{- $previewPrefixes := default (list) $params.previewBranchPrefixes }}
            {{- $hasPreview       := gt (len $previewPrefixes) 0 }}

            {{- /* Union every preview branch prefix into one alternation regex, e.g.
                   previewBranchPrefixes: [feat/, hotfix/] -> "^(feat/|hotfix/).*"
                   Adding more branch-type prefixes later needs no template changes. */}}
            {{- $quoted := list }}
            {{- range $p := $previewPrefixes }}
            {{- $quoted = append $quoted (regexQuoteMeta $p) }}
            {{- end }}
            {{- $previewRegex := printf "^(%s).*" (join "|" $quoted) }}

            {{- /* ArgoCD-side (render-time) template fragments, evaluated per generated
                   branch by the ApplicationSet controller. Crossplane only substitutes
                   $previewRegex/$previewNamespace/$mainNamespace into the text below at
                   compose time - the {{ }} in these fragments stay literal for Argo. */}}
            {{- $mainNamespace    := `{{ .repository }}-{{ .branch | replace "/" "-" | lower }}` }}
            {{- $previewNamespace := `preview-{{ .repository }}-{{ .branch | replace "/" "-" | lower }}` }}
            {{- $namespaceExpr    := $mainNamespace }}
            {{- $valuesExpr       := $valuesRel }}
            {{- $previewLabelExpr := "false" }}
            {{- if $hasPreview }}
            {{- $ifPreview        := printf "{{- if regexMatch %q .branch -}}" $previewRegex }}
            {{- $namespaceExpr    = printf "%s%s{{- else -}}%s{{- end -}}" $ifPreview $previewNamespace $mainNamespace }}
            {{- $valuesExpr       = printf "%sdev/values.yaml{{- else -}}%s{{- end -}}" $ifPreview $valuesRel }}
            {{- $previewLabelExpr = printf "%strue{{- else -}}false{{- end -}}" $ifPreview }}
            {{- end }}

            ---
            # Per-claim GitHub token Secret, created from spec.parameters.githubOrgPat.
            # WARNING: githubOrgPat is stored in plaintext on the claim itself (see
            # xrd.yaml) — this Secret is just where the SCM generator reads it from,
            # not a mitigation for that. Never commit a real PAT into a claim file.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: github-token-secret
                {{- if index $readyMap "github-token-secret" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  type: Opaque
                  metadata:
                    name: {{ $tokenSecret }}
                    namespace: argocd
                    labels:
                      managed-by: platform-xp-argo-appset
                      claim: {{ $claimName }}
                  stringData:
                    token: {{ $params.githubOrgPat | quote }}
              providerConfigRef:
                name: kubernetes-incluster

            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: appset
                {{- if index $readyMap "appset" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              forProvider:
                manifest:
                  apiVersion: argoproj.io/v1alpha1
                  kind: ApplicationSet
                  metadata:
                    name: {{ $claimName }}
                    namespace: argocd
                    labels:
                      managed-by: platform-xp-argo-appset
                      claim: {{ $claimName }}
                      bu-id: {{ $params.buId }}
                      aws-account-id: {{ $params.awsAccountId | quote }}
                  spec:
                    goTemplate: true
                    goTemplateOptions: ["missingkey=error"]
                    generators:
                      - scmProvider:
                          cloneProtocol: https
                          requeueAfterSeconds: {{ $requeue }}
                          github:
                            organization: {{ $params.githubOrg }}
                            allBranches: true
                            tokenRef:
                              secretName: {{ $tokenSecret }}
                              key: token
                          filters:
                            - labelMatch: {{ $topicRegex | quote }}
                              branchMatch: {{ $params.branchPattern | quote }}
                            {{- range $prefix := $previewPrefixes }}
                            - labelMatch: {{ $topicRegex | quote }}
                              branchMatch: {{ printf "^%s.*" (regexQuoteMeta $prefix) | quote }}
                            {{- end }}
                    template:
                      metadata:
                        name: {{ $claimName }}-{{`{{`}} .repository {{`}}`}}-{{`{{`}} .branch | replace "/" "-" | lower {{`}}`}}
                        labels:
                          managed-by: platform-xp-argo-appset
                          claim: {{ $claimName }}
                        finalizers:
                          - resources-finalizer.argocd.argoproj.io
                      spec:
                        project: default
                        source:
                          repoURL: '{{`{{`}} .url {{`}}`}}'
                          targetRevision: '{{`{{`}} .branch {{`}}`}}'
                          path: {{ $chartPath }}
                          helm:
                            valueFiles:
                              - '{{ $valuesExpr }}'
                        destination:
                          name: {{ $clusterName }}
                          namespace: '{{ $namespaceExpr }}'
                        syncPolicy:
                          automated:
                            prune: true
                            selfHeal: true
                          syncOptions:
                            - CreateNamespace=true
                          managedNamespaceMetadata:
                            labels:
                              repo: '{{`{{`}} .repository {{`}}`}}'
                              branch: '{{`{{`}} .branch | replace "/" "-" | lower {{`}}`}}'
                              preview: '{{ $previewLabelExpr }}'
              providerConfigRef:
                name: kubernetes-incluster
