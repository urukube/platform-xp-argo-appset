---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xuargoappsets.gitops.platform.urukube.io
  labels:
    provider: kubernetes
spec:
  compositeTypeRef:
    apiVersion: gitops.platform.urukube.io/v1alpha1
    kind: XUArgoAppSet
  mode: Pipeline
  pipeline:
    # -------------------------------------------------------------------------
    # Step 1 — Resolve EnvironmentConfigs into the pipeline context.
    # Merges org-defaults (static) with the BU-specific config selected by
    # the bu-id label matching spec.parameters.buId from the claim.
    # -------------------------------------------------------------------------
    - step: resolve-environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: org-defaults
            - type: Selector
              selector:
                matchLabels:
                  - key: bu-id
                    type: FromCompositeFieldPath
                    valueFromFieldPath: spec.parameters.buId

    # -------------------------------------------------------------------------
    # Step 2 — Generate a single ArgoCD ApplicationSet as a provider-kubernetes
    # Object resource, applied in-cluster via the static kubernetes-incluster
    # ProviderConfig declared in provider.yaml.
    #
    # goTemplate: true, so the ArgoCD ApplicationSet controller evaluates
    # {{ .repository }} / {{ .branch }} / {{ .url }} itself at generate-time.
    # Those expressions must reach the cluster byte-for-byte — the
    # {{`{{`}} ... {{`}}`}} construct below is a standard Go-template escape
    # that emits literal "{{" / "}}" so function-go-templating does not try to
    # resolve them against its own (unrelated) template context.
    #
    # A single scmProvider generator with allBranches:true plus a branchMatch
    # filter is the correct/only ArgoCD construct for "every branch matching a
    # pattern, across every repo with a topic" — ArgoCD's Git generator has no
    # branch-enumeration capability, so a Matrix combining it with the SCM
    # Provider generator would be redundant.
    # -------------------------------------------------------------------------
    - step: generate-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $params    := .observed.composite.resource.spec.parameters }}
            {{- $obs       := default (dict) .observed.resources }}
            {{- $claimName := index .observed.composite.resource.metadata.labels "crossplane.io/claim-name" }}

            {{- $readyMap := dict }}
            {{- range $crn, $res := $obs }}
            {{- range $res.resource.status.conditions }}
            {{- if and (eq .type "Ready") (eq .status "True") }}
            {{- $readyMap = merge $readyMap (dict $crn "True") }}
            {{- end }}
            {{- end }}
            {{- end }}

            {{- $clusterName    := printf "%s-eks" $params.eksFriendlyName }}
            {{- $chartPath      := $params.helmChartPath }}
            {{- $valuesPath     := $params.helmValuesPath }}
            {{- $valuesRel      := $valuesPath | trimPrefix $chartPath | trimPrefix "/" }}
            {{- $tokenSecret    := printf "%s-github-token" $claimName }}
            {{- $requeue        := $params.requeueSeconds }}
            {{- $topicRegex     := printf "^%s$" ($params.repoLabel | regexQuoteMeta) }}

            ---
            # Per-claim GitHub token Secret, created from spec.parameters.githubOrgPat.
            # WARNING: githubOrgPat is stored in plaintext on the claim itself (see
            # xrd.yaml) — this Secret is just where the SCM generator reads it from,
            # not a mitigation for that. Never commit a real PAT into a claim file.
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: github-token-secret
                {{- if index $readyMap "github-token-secret" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Secret
                  type: Opaque
                  metadata:
                    name: {{ $tokenSecret }}
                    namespace: argocd
                    labels:
                      managed-by: platform-xp-argo-appset
                      claim: {{ $claimName }}
                  stringData:
                    token: {{ $params.githubOrgPat | quote }}
              providerConfigRef:
                name: kubernetes-incluster

            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: appset
                {{- if index $readyMap "appset" }}
                gotemplating.fn.crossplane.io/ready: "True"
                {{- end }}
            spec:
              forProvider:
                manifest:
                  apiVersion: argoproj.io/v1alpha1
                  kind: ApplicationSet
                  metadata:
                    name: {{ $claimName }}
                    namespace: argocd
                    labels:
                      managed-by: platform-xp-argo-appset
                      claim: {{ $claimName }}
                      bu-id: {{ $params.buId }}
                      aws-account-id: {{ $params.awsAccountId | quote }}
                  spec:
                    goTemplate: true
                    goTemplateOptions: ["missingkey=error"]
                    generators:
                      - scmProvider:
                          requeueAfterSeconds: {{ $requeue }}
                          github:
                            organization: {{ $params.githubOrg }}
                            allBranches: true
                            tokenRef:
                              secretName: {{ $tokenSecret }}
                              key: token
                          filters:
                            - labelMatch: {{ $topicRegex | quote }}
                              branchMatch: {{ $params.branchPattern | quote }}
                    template:
                      metadata:
                        name: {{ $claimName }}-{{`{{`}} .repository {{`}}`}}-{{`{{`}} .branch | replace "/" "-" | lower {{`}}`}}
                        labels:
                          managed-by: platform-xp-argo-appset
                          claim: {{ $claimName }}
                      spec:
                        project: default
                        source:
                          repoURL: '{{`{{`}} .url {{`}}`}}'
                          targetRevision: '{{`{{`}} .branch {{`}}`}}'
                          path: {{ $chartPath }}
                          helm:
                            valueFiles:
                              - {{ $valuesRel }}
                        destination:
                          name: {{ $clusterName }}
                          namespace: '{{`{{`}} .repository {{`}}`}}-{{`{{`}} .branch | replace "/" "-" | lower {{`}}`}}'
                        syncPolicy:
                          automated:
                            prune: true
                            selfHeal: true
                          syncOptions:
                            - CreateNamespace=true
                          managedNamespaceMetadata:
                            labels:
                              repo: '{{`{{`}} .repository {{`}}`}}'
                              branch: '{{`{{`}} .branch | replace "/" "-" | lower {{`}}`}}'
              providerConfigRef:
                name: kubernetes-incluster
