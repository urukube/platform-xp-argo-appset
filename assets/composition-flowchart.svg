<svg viewBox="0 0 1100 1150" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-monospace,monospace" font-size="12">
  <title>Platform-XP-Argo-AppSet Composition Flowchart</title>
  <desc>Crossplane XRD composition pipeline generating two ArgoCD ApplicationSets (preview + prod) via provider-kubernetes</desc>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect width="1100" height="1150" fill="#0f172a"/>

  <!-- SECTION LABELS + DIVIDERS -->
  <text x="20" y="26" font-size="10" font-weight="600" fill="#475569" letter-spacing="1.5">INPUTS · REQUIRED</text>
  <line x1="20" y1="32" x2="1080" y2="32" stroke="#1e293b" stroke-width="1.5"/>

  <text x="20" y="200" font-size="10" font-weight="600" fill="#475569" letter-spacing="1.5">INPUTS · OPTIONAL (defaults shown)</text>
  <line x1="20" y1="206" x2="1080" y2="206" stroke="#1e293b" stroke-width="1.5"/>

  <text x="20" y="290" font-size="10" font-weight="600" fill="#475569" letter-spacing="1.5">CLAIM</text>
  <line x1="20" y1="296" x2="1080" y2="296" stroke="#1e293b" stroke-width="1.5"/>

  <text x="20" y="416" font-size="10" font-weight="600" fill="#475569" letter-spacing="1.5">PIPELINE · STEP 1</text>
  <line x1="20" y1="422" x2="1080" y2="422" stroke="#1e293b" stroke-width="1.5"/>

  <text x="20" y="540" font-size="10" font-weight="600" fill="#475569" letter-spacing="1.5">PIPELINE · STEP 2</text>
  <text x="200" y="540" font-size="9" font-weight="600" fill="#64748b">(unused downstream — parity with other platform-xp-* XRDs)</text>
  <line x1="20" y1="546" x2="1080" y2="546" stroke="#1e293b" stroke-width="1.5"/>

  <text x="20" y="654" font-size="10" font-weight="600" fill="#475569" letter-spacing="1.5">PIPELINE · STEP 3</text>
  <line x1="20" y1="660" x2="1080" y2="660" stroke="#1e293b" stroke-width="1.5"/>

  <text x="20" y="810" font-size="10" font-weight="600" fill="#475569" letter-spacing="1.5">COMPOSED RESOURCES</text>
  <line x1="20" y1="816" x2="1080" y2="816" stroke="#1e293b" stroke-width="1.5"/>

  <!-- ROW A — required inputs (5) -->
  <rect x="20" y="40" width="204" height="58" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="122" y="60" text-anchor="middle" font-weight="600" fill="#e2e8f0">buId</text>
  <text x="122" y="76" text-anchor="middle" fill="#94a3b8" font-size="10">string · required</text>
  <text x="122" y="90" text-anchor="middle" fill="#64748b" font-size="10">BU\d{3}</text>

  <rect x="234" y="40" width="204" height="58" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="336" y="60" text-anchor="middle" font-weight="600" fill="#e2e8f0">awsAccountId</text>
  <text x="336" y="76" text-anchor="middle" fill="#94a3b8" font-size="10">string · required</text>
  <text x="336" y="90" text-anchor="middle" fill="#64748b" font-size="10">12-digit · Step 2 only</text>

  <rect x="448" y="40" width="204" height="58" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="550" y="60" text-anchor="middle" font-weight="600" fill="#e2e8f0">region</text>
  <text x="550" y="76" text-anchor="middle" fill="#94a3b8" font-size="10">string · required</text>
  <text x="550" y="90" text-anchor="middle" fill="#64748b" font-size="10">Step 2 only</text>

  <rect x="662" y="40" width="204" height="58" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="764" y="60" text-anchor="middle" font-weight="600" fill="#e2e8f0">githubOrg</text>
  <text x="764" y="76" text-anchor="middle" fill="#94a3b8" font-size="10">string · required</text>
  <text x="764" y="90" text-anchor="middle" fill="#64748b" font-size="10">org to scan for repos</text>

  <rect x="876" y="40" width="204" height="58" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="978" y="60" text-anchor="middle" font-weight="600" fill="#e2e8f0">repoTopic</text>
  <text x="978" y="76" text-anchor="middle" fill="#94a3b8" font-size="10">string · required</text>
  <text x="978" y="90" text-anchor="middle" fill="#64748b" font-size="10">GitHub topic filter</text>

  <!-- ROW B — required inputs (4) -->
  <rect x="20" y="112" width="257" height="58" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="148" y="132" text-anchor="middle" font-weight="600" fill="#e2e8f0">devClusterName</text>
  <text x="148" y="148" text-anchor="middle" fill="#94a3b8" font-size="10">string · required</text>
  <text x="148" y="162" text-anchor="middle" fill="#64748b" font-size="10">ArgoCD-registered name</text>

  <rect x="287" y="112" width="257" height="58" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="415" y="132" text-anchor="middle" font-weight="600" fill="#e2e8f0">devClusterServer</text>
  <text x="415" y="148" text-anchor="middle" fill="#94a3b8" font-size="10">string (uri) · required</text>
  <text x="415" y="162" text-anchor="middle" fill="#64748b" font-size="10">dev cluster API server</text>

  <rect x="554" y="112" width="257" height="58" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="682" y="132" text-anchor="middle" font-weight="600" fill="#e2e8f0">prodClusterName</text>
  <text x="682" y="148" text-anchor="middle" fill="#94a3b8" font-size="10">string · required</text>
  <text x="682" y="162" text-anchor="middle" fill="#64748b" font-size="10">ArgoCD-registered name</text>

  <rect x="821" y="112" width="257" height="58" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="949" y="132" text-anchor="middle" font-weight="600" fill="#e2e8f0">prodClusterServer</text>
  <text x="949" y="148" text-anchor="middle" fill="#94a3b8" font-size="10">string (uri) · required</text>
  <text x="949" y="162" text-anchor="middle" fill="#64748b" font-size="10">prod cluster API server</text>

  <!-- ROW C — optional inputs (6) -->
  <rect x="20" y="210" width="170" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="105" y="228" text-anchor="middle" font-weight="600" font-size="11" fill="#e2e8f0">helmChartPath</text>
  <text x="105" y="244" text-anchor="middle" fill="#64748b" font-size="9">default: helm/</text>

  <rect x="198" y="210" width="170" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="283" y="228" text-anchor="middle" font-weight="600" font-size="11" fill="#e2e8f0">helmValuesPath</text>
  <text x="283" y="244" text-anchor="middle" fill="#64748b" font-size="9">default: helm/values.yaml</text>

  <rect x="376" y="210" width="170" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="461" y="228" text-anchor="middle" font-weight="600" font-size="11" fill="#e2e8f0">branchPrefix</text>
  <text x="461" y="244" text-anchor="middle" fill="#64748b" font-size="9">default: feat/</text>

  <rect x="554" y="210" width="170" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="639" y="228" text-anchor="middle" font-weight="600" font-size="11" fill="#e2e8f0">argocdNamespace</text>
  <text x="639" y="244" text-anchor="middle" fill="#64748b" font-size="9">default: argocd</text>

  <rect x="732" y="210" width="170" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="817" y="228" text-anchor="middle" font-weight="600" font-size="11" fill="#e2e8f0">githubTokenSecretName</text>
  <text x="817" y="244" text-anchor="middle" fill="#64748b" font-size="9">default: argocd-github-token</text>

  <rect x="910" y="210" width="170" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="995" y="228" text-anchor="middle" font-weight="600" font-size="11" fill="#e2e8f0">requeueSeconds</text>
  <text x="995" y="244" text-anchor="middle" fill="#64748b" font-size="9">default: 180</text>

  <line x1="550" y1="260" x2="550" y2="298" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- CLAIM -->
  <rect x="350" y="304" width="400" height="68" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
  <text x="550" y="329" text-anchor="middle" font-weight="700" font-size="13" fill="#a5b4fc">UArgoAppSet Claim</text>
  <text x="550" y="346" text-anchor="middle" fill="#94a3b8" font-size="10">apiVersion: gitops.platform.urukube.io/v1alpha1</text>
  <text x="550" y="361" text-anchor="middle" fill="#94a3b8" font-size="10">kind: UArgoAppSet · namespace-scoped · one claim per env pair</text>

  <line x1="550" y1="372" x2="550" y2="424" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- STEP 1 -->
  <rect x="40" y="432" width="200" height="62" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="140" y="452" text-anchor="middle" font-weight="600" fill="#e2e8f0" font-size="11">org-defaults</text>
  <text x="140" y="468" text-anchor="middle" fill="#94a3b8" font-size="10">EnvironmentConfig</text>
  <text x="140" y="482" text-anchor="middle" fill="#64748b" font-size="10">static reference</text>

  <rect x="260" y="432" width="200" height="62" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
  <text x="360" y="452" text-anchor="middle" font-weight="600" fill="#e2e8f0" font-size="11">BU-specific config</text>
  <text x="360" y="468" text-anchor="middle" fill="#94a3b8" font-size="10">EnvironmentConfig</text>
  <text x="360" y="482" text-anchor="middle" fill="#64748b" font-size="10">label: bu-id=buId</text>

  <rect x="500" y="426" width="560" height="74" rx="8" fill="#1c1a0e" stroke="#d97706" stroke-width="2"/>
  <text x="780" y="450" text-anchor="middle" font-weight="700" font-size="12" fill="#fbbf24">function-environment-configs  v0.6.0</text>
  <text x="780" y="467" text-anchor="middle" fill="#94a3b8" font-size="10">merge org-defaults + BU config into the pipeline context</text>
  <text x="780" y="483" text-anchor="middle" fill="#64748b" font-size="10">identical to every other platform-xp-* XRD</text>

  <line x1="460" y1="463" x2="498" y2="463" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="140" y1="494" x2="140" y2="514" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="140" y1="514" x2="498" y2="514" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <line x1="780" y1="500" x2="780" y2="530" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="780" y1="530" x2="550" y2="530" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="550" y1="530" x2="550" y2="548" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- STEP 2 -->
  <rect x="270" y="552" width="560" height="68" rx="8" fill="#1c1a0e" stroke="#d97706" stroke-width="2"/>
  <text x="550" y="576" text-anchor="middle" font-weight="700" font-size="12" fill="#fbbf24">function-patch-and-transform  v0.10.7</text>
  <text x="550" y="593" text-anchor="middle" fill="#94a3b8" font-size="10">stamps a per-claim AWS ProviderConfig (IRSA → urukube-crossplane-role)</text>
  <text x="550" y="608" text-anchor="middle" fill="#64748b" font-size="10">boilerplate for pipeline parity — no Step 3 resource references it</text>

  <line x1="550" y1="620" x2="550" y2="662" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- STEP 3 -->
  <rect x="210" y="668" width="680" height="88" rx="8" fill="#0c1a2e" stroke="#60a5fa" stroke-width="2"/>
  <text x="550" y="692" text-anchor="middle" font-weight="700" font-size="12" fill="#93c5fd">function-go-templating  v0.7.0</text>
  <text x="550" y="709" text-anchor="middle" fill="#94a3b8" font-size="10">renders 2× kubernetes.crossplane.io/v1alpha2 Object, each wrapping an ApplicationSet manifest</text>
  <text x="550" y="725" text-anchor="middle" fill="#64748b" font-size="10">$readyMap built from .observed.resources → gotemplating.fn.crossplane.io/ready propagated per resource</text>
  <text x="550" y="741" text-anchor="middle" fill="#64748b" font-size="10">single scmProvider generator per AppSet (allBranches + branchMatch) — no Matrix; Git generator can't enumerate branches</text>

  <line x1="400" y1="756" x2="400" y2="818" stroke="#60a5fa" stroke-width="1.2" marker-end="url(#arr-b)"/>
  <line x1="700" y1="756" x2="700" y2="818" stroke="#60a5fa" stroke-width="1.2" marker-end="url(#arr-b)"/>

  <!-- COMPOSED RESOURCES -->
  <rect x="70" y="822" width="500" height="184" rx="8" fill="#0c1a2e" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="320" y="846" text-anchor="middle" font-weight="700" font-size="12" fill="#93c5fd">Object: preview-appset</text>
  <text x="320" y="862" text-anchor="middle" fill="#94a3b8" font-size="10">kubernetes.crossplane.io/v1alpha2 · providerConfigRef: kubernetes-incluster</text>
  <line x1="86" y1="872" x2="554" y2="872" stroke="#1e293b" stroke-width="1"/>
  <text x="320" y="890" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">wraps: ApplicationSet {claim}-preview  (ns: argocd)</text>
  <text x="320" y="908" text-anchor="middle" fill="#64748b" font-size="10">generator: scmProvider · allBranches: true</text>
  <text x="320" y="924" text-anchor="middle" fill="#64748b" font-size="10">filters: labelMatch=repoTopic · branchMatch=^branchPrefix.*</text>
  <text x="320" y="940" text-anchor="middle" fill="#64748b" font-size="10">destination: devClusterName · ns: {repo}-{branch-slug}</text>
  <text x="320" y="956" text-anchor="middle" fill="#64748b" font-size="10">syncPolicy: automated, prune, selfHeal, CreateNamespace=true</text>
  <text x="320" y="972" text-anchor="middle" fill="#64748b" font-size="10">managedNamespaceMetadata: preview=true, repo, branch</text>
  <text x="320" y="994" text-anchor="middle" fill="#6ee7b7" font-size="10" font-style="italic">deleted branch → Application deleted → namespace pruned</text>

  <rect x="600" y="822" width="430" height="184" rx="8" fill="#0c1a2e" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="815" y="846" text-anchor="middle" font-weight="700" font-size="12" fill="#93c5fd">Object: prod-appset</text>
  <text x="815" y="862" text-anchor="middle" fill="#94a3b8" font-size="10">kubernetes.crossplane.io/v1alpha2 · providerConfigRef: kubernetes-incluster</text>
  <line x1="616" y1="872" x2="1014" y2="872" stroke="#1e293b" stroke-width="1"/>
  <text x="815" y="890" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">wraps: ApplicationSet {claim}-prod  (ns: argocd)</text>
  <text x="815" y="908" text-anchor="middle" fill="#64748b" font-size="10">generator: scmProvider · allBranches: false</text>
  <text x="815" y="924" text-anchor="middle" fill="#64748b" font-size="10">filters: labelMatch=repoTopic · branchMatch=^main$</text>
  <text x="815" y="940" text-anchor="middle" fill="#64748b" font-size="10">destination: prodClusterName · ns: {repo}</text>
  <text x="815" y="956" text-anchor="middle" fill="#64748b" font-size="10">syncPolicy: automated, prune, selfHeal, CreateNamespace=true</text>
  <text x="815" y="972" text-anchor="middle" fill="#64748b" font-size="10">managedNamespaceMetadata: env=prod, repo</text>
  <text x="815" y="994" text-anchor="middle" fill="#6ee7b7" font-size="10" font-style="italic">persists for the lifetime of the repo</text>

  <!-- LEGEND -->
  <rect x="20" y="1030" width="1060" height="56" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <line x1="38" y1="1058" x2="68" y2="1058" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="76" y="1062" fill="#94a3b8" font-size="10">data flow</text>
  <line x1="150" y1="1058" x2="180" y2="1058" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="188" y="1062" fill="#94a3b8" font-size="10">context merge</text>
  <rect x="290" y="1049" width="12" height="12" rx="2" fill="none" stroke="#818cf8" stroke-width="2"/>
  <text x="308" y="1060" fill="#94a3b8" font-size="10">claim</text>
  <rect x="360" y="1049" width="12" height="12" rx="2" fill="none" stroke="#d97706" stroke-width="2"/>
  <text x="378" y="1060" fill="#94a3b8" font-size="10">composition function (AWS-oriented steps)</text>
  <rect x="620" y="1049" width="12" height="12" rx="2" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <text x="638" y="1060" fill="#94a3b8" font-size="10">composition function / resource (provider-kubernetes, in-cluster)</text>

  <text x="550" y="1112" text-anchor="middle" fill="#334155" font-size="10">Platform-XP-Argo-AppSet · Crossplane XRD Composition Pipeline</text>
</svg>
