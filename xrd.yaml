---
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xuargoappsets.gitops.platform.urukube.io
spec:
  group: gitops.platform.urukube.io
  names:
    kind: XUArgoAppSet
    plural: xuargoappsets
  claimNames:
    kind: UArgoAppSet
    plural: uargoappsets
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - parameters
              properties:
                parameters:
                  type: object
                  required:
                    - buId
                    - eksFriendlyName
                    - environment
                    - awsAccountId
                    - githubOrg
                    - repoLabel
                    - githubOrgPat
                  properties:
                    buId:
                      type: string
                      description: Business Unit identifier — must match an EnvironmentConfig with label bu-id
                      pattern: "^BU[0-9]{3}$"
                    eksFriendlyName:
                      type: string
                      description: >-
                        friendlyName of the target UEks claim (platform-xp-eks). The
                        Application destination is the cluster named
                        <eksFriendlyName>-eks — which platform-xp-eks registers with
                        the orchestrator's ArgoCD automatically, so it must already
                        exist and be Ready before this claim is created.
                    environment:
                      type: string
                      description: >-
                        Environment name (e.g. dev, staging, prod, or any
                        custom name). Selects the values file used by the
                        generated ApplicationSet —
                        <helmChartPath>/<environment>/values.yaml in each
                        matched repo.
                    awsAccountId:
                      type: string
                      description: >-
                        12-digit AWS account ID the target cluster lives in. Not
                        consumed by any resource in this composition — the generated
                        ApplicationSet is applied in-cluster on the orchestrator —
                        carried only as a label for cross-referencing.
                      pattern: "^[0-9]{12}$"
                    githubOrg:
                      type: string
                      description: GitHub organisation to scan for repositories.
                    repoLabel:
                      type: string
                      description: GitHub topic that marks repos eligible for deployment by this ApplicationSet.
                    branchPattern:
                      type: string
                      default: ""
                      description: >-
                        Regex matched against branch names (ArgoCD SCM generator
                        branchMatch). Every matching branch, across every repo
                        carrying repoLabel, gets its own Application deployed to
                        <eksFriendlyName>-eks — pruned automatically when the
                        branch is deleted or stops matching. Examples: "^main$" for
                        a single fixed branch, "^release/.*" for a release-branch
                        pattern. Leave empty (default) to disable this generator
                        entirely — e.g. when a claim should only deploy
                        previewBranchPrefixes branches, with another claim owning
                        the fixed-branch deployment. At least one of
                        branchPattern/previewBranchPrefixes must be non-empty.
                    previewBranchPrefixes:
                      type: array
                      items:
                        type: string
                      default: []
                      description: >-
                        Optional list of branch-name prefixes (plain strings, not
                        regex — e.g. "feat/", "fix/") that additionally deploy
                        from this repo as preview environments. Every branch
                        across every repo carrying repoLabel whose name starts
                        with one of these prefixes gets its own Application,
                        always using <helmChartPath>/dev/values.yaml regardless
                        of the environment parameter, deployed to a namespace
                        prefixed with "preview-" (preview-<repo>-<branch-slug>)
                        — pruned automatically like any other matched branch.
                        Leave empty (default) to disable preview-branch
                        deployments entirely. Example: ["feat/", "fix/"].
                    helmChartPath:
                      type: string
                      default: "helm/"
                      description: Path to the Helm chart inside each repo.
                    githubOrgPat:
                      type: string
                      description: >-
                        GitHub personal access token (repo read + read:org scopes)
                        used by the ApplicationSet's SCM generator to enumerate
                        repositories and branches in githubOrg. The composition
                        stores this in a Secret in the argocd namespace on the
                        orchestrator cluster — it is not read from an
                        externally-managed secret. WARNING: this value is stored
                        in plaintext in spec.parameters (visible via kubectl get,
                        and in git if the claim manifest is committed) — never
                        commit a real PAT into a claim file; apply it via
                        kubectl/CI injection instead.
                    requeueSeconds:
                      type: integer
                      default: 180
                      description: How often the SCM generator polls GitHub for branch changes.
